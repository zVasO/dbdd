[package]
name = "spool-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
spool-core = { path = "../../../crates/spool-core" }
spool-engine = { path = "../../../crates/spool-engine" }
spool-config = { path = "../../../crates/spool-config" }
spool-mysql = { path = "../../../crates/spool-mysql" }
spool-sqlite = { path = "../../../crates/spool-sqlite" }
spool-postgres = { path = "../../../crates/spool-postgres" }
tauri = { workspace = true }
tauri-plugin-stronghold = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rfd = "0.15"
csv = "1"
tauri-plugin-notification = "2"
dirs = "7"

[features]
devtools = ["tauri/devtools"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

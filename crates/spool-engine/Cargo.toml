[package]
name = "spool-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["mysql", "sqlite", "postgres"]
mysql = ["spool-mysql"]
sqlite = ["spool-sqlite"]
postgres = ["spool-postgres"]

[dependencies]
spool-core = { path = "../spool-core" }
spool-config = { path = "../spool-config" }
spool-mysql = { path = "../spool-mysql", optional = true }
spool-sqlite = { path = "../spool-sqlite", optional = true }
spool-postgres = { path = "../spool-postgres", optional = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tauri = { workspace = true }
